<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Come With — Customer portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Inconsolata:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --ink: #1A1410; --bg: #F2EDE6; --red: #C13B2A; --red-dk: #8C2A1C;
  --mid: #8A7F72; --off: #E8E2D9; --border: rgba(26,20,16,0.14);
  --border-strong: rgba(26,20,16,0.3); --green: #3B6D11; --green-bg: #DFF0D0;
  --amber: #854F0B; --amber-bg: #FFF0D0; --blue: #185FA5; --blue-bg: #DCEEFF;
}
body {
  background: var(--bg); color: var(--ink);
  font-family: 'Inconsolata', monospace; font-weight: 400;
  min-height: 100vh; line-height: 1.55;
}
body::before {
  content: ''; position: fixed; inset: 0;
  background-image: radial-gradient(circle, rgba(26,20,16,0.05) 1px, transparent 1px);
  background-size: 18px 18px; pointer-events: none; z-index: 0;
}

.boot {
  position: fixed; inset: 0; z-index: 2; background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  font-size: 0.75rem; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--mid); transition: opacity 0.2s;
}
.boot::after {
  content: ''; display: inline-block; width: 12px; height: 12px;
  border: 2px solid var(--border); border-top-color: var(--red);
  border-radius: 50%; margin-left: 10px; animation: spin 0.6s linear infinite;
}
.boot.hide { opacity: 0; pointer-events: none; }
@keyframes spin { to { transform: rotate(360deg); } }

.login {
  position: relative; z-index: 1; min-height: 100vh;
  display: none; align-items: center; justify-content: center; padding: 24px;
}
.login.show { display: flex; }
.login-card {
  background: white; border: 1px solid var(--border);
  padding: 40px 36px; width: 100%; max-width: 420px;
}
.brand {
  font-family: 'Bebas Neue', sans-serif; font-size: 1.8rem;
  letter-spacing: 0.06em; line-height: 1;
}
.brand-sub {
  font-size: 0.6rem; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--mid); margin-top: 6px; margin-bottom: 28px;
}
.label {
  display: block; font-size: 0.6rem; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--mid); margin-bottom: 8px;
}
.input {
  width: 100%; font-family: 'Inconsolata', monospace; font-size: 0.95rem;
  padding: 12px 14px; border: 1px solid var(--border-strong);
  background: white; color: var(--ink); outline: none; border-radius: 0;
}
.input:focus { border-color: var(--red); }
.btn-primary {
  width: 100%; margin-top: 16px;
  font-family: 'Bebas Neue', sans-serif; font-size: 1rem; letter-spacing: 0.1em;
  padding: 14px; background: var(--red); color: white; border: none;
  cursor: pointer; transition: background 0.15s;
}
.btn-primary:hover:not(:disabled) { background: var(--red-dk); }
.btn-primary:disabled { opacity: 0.55; cursor: not-allowed; }
.msg {
  margin-top: 18px; font-size: 0.78rem; line-height: 1.45;
  padding: 12px 14px; border-left: 3px solid transparent;
}
.msg.info { background: var(--blue-bg); color: var(--blue); border-left-color: var(--blue); }
.msg.err  { background: #fbe6e1;        color: var(--red-dk); border-left-color: var(--red); }
.msg.ok   { background: var(--green-bg); color: var(--green); border-left-color: var(--green); }
.msg:empty { display: none; }

.portal { position: relative; z-index: 1; display: none; max-width: 760px; margin: 0 auto; padding: 32px 24px 80px; }
.portal.show { display: block; }

.portal-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 28px; padding-bottom: 18px; border-bottom: 1px solid var(--border);
}
.portal-id { line-height: 1.3; }
.portal-name {
  font-family: 'Bebas Neue', sans-serif; font-size: 1.7rem;
  letter-spacing: 0.04em;
}
.portal-email { font-size: 0.78rem; color: var(--mid); }
.signout-btn {
  background: none; border: 1px solid var(--border);
  font-family: 'Inconsolata', monospace; font-size: 0.7rem;
  letter-spacing: 0.08em; color: var(--mid);
  padding: 8px 16px; cursor: pointer; transition: all 0.15s;
}
.signout-btn:hover { color: var(--red); border-color: var(--red); }

.section { margin-bottom: 36px; }
.section-title {
  font-family: 'Bebas Neue', sans-serif; font-size: 1.2rem;
  letter-spacing: 0.04em; margin-bottom: 14px;
}
.placeholder {
  background: white; border: 1px dashed var(--border-strong);
  padding: 28px 24px; text-align: center;
  font-size: 0.85rem; color: var(--mid); line-height: 1.6;
}
.placeholder strong { color: var(--ink); }

/* Agreement cards */
.agreement-card {
  background: white; border: 1px solid var(--border);
  padding: 20px 22px; margin-bottom: 12px;
}
.agreement-row {
  display: flex; align-items: center; justify-content: space-between;
  gap: 16px; flex-wrap: wrap;
}
.agreement-meta { flex: 1; min-width: 200px; }
.agreement-type {
  font-family: 'Bebas Neue', sans-serif; font-size: 1rem;
  letter-spacing: 0.06em; color: var(--ink);
}
.agreement-detail {
  font-size: 0.78rem; color: var(--mid); margin-top: 4px;
}
.agreement-total {
  font-family: 'Inconsolata', monospace; font-size: 1.1rem; font-weight: 500;
  font-variant-numeric: tabular-nums; color: var(--ink); margin-right: 16px;
}
.agreement-status {
  display: inline-block; font-size: 0.6rem; letter-spacing: 0.1em;
  text-transform: uppercase; padding: 4px 10px; white-space: nowrap;
}
.status-draft     { background: var(--off);      color: var(--mid); }
.status-sent      { background: var(--blue-bg);  color: var(--blue); }
.status-signed    { background: var(--green-bg); color: var(--green); }
.status-cancelled { background: #f5e2de;         color: var(--red-dk); }
.status-completed { background: var(--green-bg); color: var(--green); }

.sign-link {
  display: inline-block; margin-top: 14px;
  font-family: 'Bebas Neue', sans-serif; font-size: 0.85rem; letter-spacing: 0.08em;
  padding: 8px 18px; background: var(--red); color: white;
  text-decoration: none; transition: background 0.15s;
}
.sign-link:hover { background: var(--red-dk); }

.no-link {
  display: inline-block; margin-top: 14px;
  font-size: 0.78rem; color: var(--mid);
}
.no-link a { color: var(--ink); }

.row-count {
  font-family: 'Inconsolata', monospace; font-size: 0.7rem;
  letter-spacing: 0.1em; color: var(--mid); text-transform: uppercase;
  margin-bottom: 12px;
}
</style>
</head>
<body>

<div class="boot" id="boot">Checking session</div>

<section class="login" id="login">
  <div class="login-card">
    <div class="brand">Come With</div>
    <div class="brand-sub">Customer portal</div>
    <form id="loginForm">
      <label class="label" for="email">Email</label>
      <input class="input" type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required />
      <button class="btn-primary" type="submit" id="loginBtn">Send sign-in link</button>
    </form>
    <div class="msg" id="loginMsg"></div>
  </div>
</section>

<div class="portal" id="portal">
  <div class="portal-header">
    <div class="portal-id">
      <div class="portal-name" id="customerName">—</div>
      <div class="portal-email" id="customerEmail">—</div>
    </div>
    <button class="signout-btn" id="signOutBtn">Sign out</button>
  </div>

  <div class="section">
    <div class="section-title">Your agreements</div>
    <div class="row-count" id="agreementCount">—</div>
    <div id="agreementsPanel"></div>
  </div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = 'https://yaytdosxfhcqatmhctzk.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_IkigzWOTU3ZSMK9DxqwwJw_AaQkShCi';

const sb = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
  auth: { detectSessionInUrl: true, persistSession: true, autoRefreshToken: true },
});

const $ = (id) => document.getElementById(id);

function hideBoot() {
  const b = $('boot');
  b.classList.add('hide');
  setTimeout(() => { b.style.display = 'none'; }, 220);
}
function showLogin() { hideBoot(); $('login').classList.add('show'); $('portal').classList.remove('show'); }
function showPortal() { hideBoot(); $('login').classList.remove('show'); $('portal').classList.add('show'); }
function setMsg(text, kind = 'info') {
  const el = $('loginMsg');
  el.className = 'msg ' + kind;
  el.textContent = text || '';
}

function fmtDate(s) {
  if (!s) return '';
  const d = new Date(s); return isNaN(d) ? s : d.toISOString().slice(0, 10);
}
function money(n) {
  return n == null ? '—' : '$' + Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'", '&#39;');
}

async function loadAgreements() {
  // RLS: "Customers can read own agreements" filters to agreements whose
  // client_id is owned by this auth.uid(). Embed agreement_links so we can
  // surface an existing token if there is one (public-readable by policy).
  const { data, error } = await sb
    .from('agreements')
    .select('id, agreement_type, status, event_date, venue_name, total_amount, client_signed_at, agreement_links(token, expires_at, used_at)')
    .order('created_at', { ascending: false });

  const panel = $('agreementsPanel');
  const countEl = $('agreementCount');

  if (error) {
    countEl.textContent = '';
    panel.innerHTML = `<div class="placeholder"><strong>Couldn't load:</strong> ${escapeHtml(error.message)}</div>`;
    return;
  }
  if (!data || data.length === 0) {
    countEl.textContent = '';
    panel.innerHTML = `<div class="placeholder">No agreements yet. When Berky drafts and sends you one, it'll show up here. Questions? <a href="mailto:berky@comewith.org" style="color:inherit;">Email berky@comewith.org</a>.</div>`;
    return;
  }

  countEl.textContent = data.length + ' agreement' + (data.length === 1 ? '' : 's');

  const now = new Date();
  panel.innerHTML = data.map(a => {
    const status = (a.status || 'draft').toLowerCase();
    const isUnsignedSent = status === 'sent' && !a.client_signed_at;
    let signCta = '';
    if (isUnsignedSent) {
      // Find an unused, unexpired link
      const links = a.agreement_links || [];
      const usable = links.find(l => !l.used_at && new Date(l.expires_at) > now);
      if (usable) {
        signCta = `<a class="sign-link" href="sign.html?token=${encodeURIComponent(usable.token)}">Review &amp; sign</a>`;
      } else {
        signCta = `<div class="no-link">Signing link expired. <a href="mailto:berky@comewith.org">Email Berky</a> for a new one.</div>`;
      }
    }
    const event = [fmtDate(a.event_date), a.venue_name].filter(Boolean).join(' · ');
    return `<div class="agreement-card">
      <div class="agreement-row">
        <div class="agreement-meta">
          <div class="agreement-type">${escapeHtml(a.agreement_type === 'rental' ? 'Equipment Rental' : 'Events Services')}</div>
          ${event ? `<div class="agreement-detail">${escapeHtml(event)}</div>` : ''}
        </div>
        <div class="agreement-total">${money(a.total_amount)}</div>
        <span class="agreement-status status-${escapeHtml(status)}">${escapeHtml(status)}</span>
      </div>
      ${signCta}
    </div>`;
  }).join('');
}

async function renderForSession(session) {
  if (!session) { showLogin(); return; }
  const { data: profile, error } = await sb
    .from('profiles')
    .select('full_name, email, role')
    .eq('id', session.user.id)
    .single();
  if (error) {
    setMsg('Signed in but could not load your profile: ' + error.message, 'err');
    showLogin();
    return;
  }
  // Admins land on the admin dashboard, not the customer portal.
  if (profile.role === 'master_admin' || profile.role === 'sub_admin') {
    window.location.href = 'dashboard.html';
    return;
  }
  $('customerName').textContent = profile.full_name || profile.email || 'Customer';
  $('customerEmail').textContent = profile.email || '';
  showPortal();
  loadAgreements();
}

sb.auth.onAuthStateChange((_e, session) => renderForSession(session));

$('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = $('email').value.trim();
  if (!email) return;
  const btn = $('loginBtn');
  btn.disabled = true;
  setMsg('Sending link…', 'info');
  const { error } = await sb.auth.signInWithOtp({
    email,
    options: { emailRedirectTo: window.location.origin + window.location.pathname },
  });
  btn.disabled = false;
  if (error) { setMsg('Failed: ' + error.message, 'err'); return; }
  setMsg('Check ' + email + ' for a sign-in link.', 'ok');
});

$('signOutBtn').addEventListener('click', async () => { await sb.auth.signOut(); });

const { data: { session } } = await sb.auth.getSession();
await renderForSession(session);
</script>
</body>
</html>
