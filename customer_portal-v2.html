<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Come With — Customer portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Inconsolata:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --ink: #1A1410; --bg: #F2EDE6; --red: #C13B2A; --red-dk: #8C2A1C;
  --mid: #8A7F72; --off: #E8E2D9; --border: rgba(26,20,16,0.14);
  --border-strong: rgba(26,20,16,0.3); --green: #3B6D11; --green-bg: #DFF0D0;
  --amber: #854F0B; --amber-bg: #FFF0D0; --blue: #185FA5; --blue-bg: #DCEEFF;
}
body {
  background: var(--bg); color: var(--ink);
  font-family: 'Inconsolata', monospace; font-weight: 400;
  min-height: 100vh; line-height: 1.55;
}
body::before {
  content: ''; position: fixed; inset: 0;
  background-image: radial-gradient(circle, rgba(26,20,16,0.05) 1px, transparent 1px);
  background-size: 18px 18px; pointer-events: none; z-index: 0;
}

.boot {
  position: fixed; inset: 0; z-index: 2; background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  font-size: 0.75rem; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--mid); transition: opacity 0.2s;
}
.boot::after {
  content: ''; display: inline-block; width: 12px; height: 12px;
  border: 2px solid var(--border); border-top-color: var(--red);
  border-radius: 50%; margin-left: 10px; animation: spin 0.6s linear infinite;
}
.boot.hide { opacity: 0; pointer-events: none; }
@keyframes spin { to { transform: rotate(360deg); } }

.login {
  position: relative; z-index: 1; min-height: 100vh;
  display: none; align-items: center; justify-content: center; padding: 24px;
}
.login.show { display: flex; }
.login-card {
  background: white; border: 1px solid var(--border);
  padding: 40px 36px; width: 100%; max-width: 420px;
}
.brand {
  font-family: 'Bebas Neue', sans-serif; font-size: 1.8rem;
  letter-spacing: 0.06em; line-height: 1;
}
.brand-sub {
  font-size: 0.6rem; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--mid); margin-top: 6px; margin-bottom: 28px;
}
.label {
  display: block; font-size: 0.6rem; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--mid); margin-bottom: 8px;
}
.input {
  width: 100%; font-family: 'Inconsolata', monospace; font-size: 0.95rem;
  padding: 12px 14px; border: 1px solid var(--border-strong);
  background: white; color: var(--ink); outline: none; border-radius: 0;
}
.input:focus { border-color: var(--red); }
.btn-primary {
  width: 100%; margin-top: 16px;
  font-family: 'Bebas Neue', sans-serif; font-size: 1rem; letter-spacing: 0.1em;
  padding: 14px; background: var(--red); color: white; border: none;
  cursor: pointer; transition: background 0.15s;
}
.btn-primary:hover:not(:disabled) { background: var(--red-dk); }
.btn-primary:disabled { opacity: 0.55; cursor: not-allowed; }
.msg {
  margin-top: 18px; font-size: 0.78rem; line-height: 1.45;
  padding: 12px 14px; border-left: 3px solid transparent;
}
.msg.info { background: var(--blue-bg); color: var(--blue); border-left-color: var(--blue); }
.msg.err  { background: #fbe6e1;        color: var(--red-dk); border-left-color: var(--red); }
.msg.ok   { background: var(--green-bg); color: var(--green); border-left-color: var(--green); }
.msg:empty { display: none; }

.portal { position: relative; z-index: 1; display: none; max-width: 760px; margin: 0 auto; padding: 32px 24px 80px; }
.portal.show { display: block; }

.portal-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 28px; padding-bottom: 18px; border-bottom: 1px solid var(--border);
}
.portal-id { line-height: 1.3; }
.portal-name {
  font-family: 'Bebas Neue', sans-serif; font-size: 1.7rem;
  letter-spacing: 0.04em;
}
.portal-email { font-size: 0.78rem; color: var(--mid); }
.signout-btn {
  background: none; border: 1px solid var(--border);
  font-family: 'Inconsolata', monospace; font-size: 0.7rem;
  letter-spacing: 0.08em; color: var(--mid);
  padding: 8px 16px; cursor: pointer; transition: all 0.15s;
}
.signout-btn:hover { color: var(--red); border-color: var(--red); }

.section { margin-bottom: 36px; }
.section-title {
  font-family: 'Bebas Neue', sans-serif; font-size: 1.2rem;
  letter-spacing: 0.04em; margin-bottom: 14px;
}
.placeholder {
  background: white; border: 1px dashed var(--border-strong);
  padding: 28px 24px; text-align: center;
  font-size: 0.85rem; color: var(--mid); line-height: 1.6;
}
.placeholder strong { color: var(--ink); }
</style>
</head>
<body>

<div class="boot" id="boot">Checking session</div>

<section class="login" id="login">
  <div class="login-card">
    <div class="brand">Come With</div>
    <div class="brand-sub">Customer portal</div>
    <form id="loginForm">
      <label class="label" for="email">Email</label>
      <input class="input" type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required />
      <button class="btn-primary" type="submit" id="loginBtn">Send sign-in link</button>
    </form>
    <div class="msg" id="loginMsg"></div>
  </div>
</section>

<div class="portal" id="portal">
  <div class="portal-header">
    <div class="portal-id">
      <div class="portal-name" id="customerName">—</div>
      <div class="portal-email" id="customerEmail">—</div>
    </div>
    <button class="signout-btn" id="signOutBtn">Sign out</button>
  </div>

  <div class="section">
    <div class="section-title">Your agreements</div>
    <div class="placeholder" id="agreementsPanel">
      <strong>Sprint 4</strong> lists your agreements here.
    </div>
  </div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = 'https://qjosjafbizxdtkisyrqm.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_aks4D0QB6tuO8pZYxCqB4A_TdBnUdYe';

const sb = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
  auth: { detectSessionInUrl: true, persistSession: true, autoRefreshToken: true },
});

const $ = (id) => document.getElementById(id);

function hideBoot() {
  const b = $('boot');
  b.classList.add('hide');
  setTimeout(() => { b.style.display = 'none'; }, 220);
}
function showLogin() { hideBoot(); $('login').classList.add('show'); $('portal').classList.remove('show'); }
function showPortal() { hideBoot(); $('login').classList.remove('show'); $('portal').classList.add('show'); }
function setMsg(text, kind = 'info') {
  const el = $('loginMsg');
  el.className = 'msg ' + kind;
  el.textContent = text || '';
}

async function renderForSession(session) {
  if (!session) { showLogin(); return; }
  const { data: profile, error } = await sb
    .from('profiles')
    .select('full_name, email')
    .eq('id', session.user.id)
    .single();
  if (error) {
    setMsg('Signed in but could not load your profile: ' + error.message, 'err');
    showLogin();
    return;
  }
  $('customerName').textContent = profile.full_name || profile.email || 'Customer';
  $('customerEmail').textContent = profile.email || '';
  showPortal();
}

sb.auth.onAuthStateChange((_e, session) => renderForSession(session));

$('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = $('email').value.trim();
  if (!email) return;
  const btn = $('loginBtn');
  btn.disabled = true;
  setMsg('Sending link…', 'info');
  const { error } = await sb.auth.signInWithOtp({
    email,
    options: { emailRedirectTo: window.location.origin + window.location.pathname },
  });
  btn.disabled = false;
  if (error) { setMsg('Failed: ' + error.message, 'err'); return; }
  setMsg('Check ' + email + ' for a sign-in link.', 'ok');
});

$('signOutBtn').addEventListener('click', async () => { await sb.auth.signOut(); });

const { data: { session } } = await sb.auth.getSession();
await renderForSession(session);
</script>
</body>
</html>
