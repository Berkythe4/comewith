<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dance Infusion #2 — Documents</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:    #0d1b2a;
    --navy2:   #1a2d42;
    --navy3:   #243b55;
    --gold:    #c9a84c;
    --gold2:   #e8c96d;
    --gold3:   #f5e6b8;
    --white:   #f0ece0;
    --muted:   #8a9bb0;
    --red:     #e05c5c;
    --green:   #4caf7d;
    --accent:  #2a6496;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--navy);
    color: var(--white);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    padding: 0 0 60px;
    background-image:
      radial-gradient(ellipse at 20% 0%, rgba(201,168,76,0.07) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 100%, rgba(42,100,150,0.1) 0%, transparent 60%);
  }
  .header {
    padding: 32px 40px 24px;
    border-bottom: 1px solid rgba(201,168,76,0.2);
    display: flex; align-items: flex-end; justify-content: space-between;
    background: linear-gradient(180deg, rgba(201,168,76,0.05) 0%, transparent 100%);
  }
  .header-left h1 { font-family:'Bebas Neue',sans-serif; font-size:48px; letter-spacing:3px; color:var(--gold); line-height:1; }
  .header-left .subtitle { font-size:13px; color:var(--muted); letter-spacing:2px; text-transform:uppercase; margin-top:4px; }
  .header-right { text-align:right; }
  .header-right .event-date { font-family:'Bebas Neue',sans-serif; font-size:22px; letter-spacing:2px; color:var(--gold2); }
  .header-right .venue { font-size:12px; color:var(--muted); letter-spacing:1px; }
  .last-updated { font-family:'DM Mono',monospace; font-size:11px; color:var(--muted); margin-top:6px; }

  /* ── SHARED NAV ── */
  .topnav {
    display:flex; gap:0;
    padding: 0 40px;
    background: rgba(13,27,42,0.6);
    border-bottom: 1px solid rgba(201,168,76,0.15);
  }
  .nav-tab {
    display:inline-block;
    padding: 14px 22px;
    font-family:'Bebas Neue', sans-serif;
    font-size:15px;
    letter-spacing:2.5px;
    color: var(--muted);
    text-decoration:none;
    border-bottom: 2px solid transparent;
    transition: color 0.2s, border-color 0.2s;
  }
  .nav-tab:hover { color: var(--gold2); }
  .nav-tab.active {
    color: var(--gold);
    border-bottom-color: var(--gold);
  }

  .main { padding:32px 40px; }

  /* ── FILTER BAR ── */
  .filter-bar {
    display:flex; gap:12px; flex-wrap:wrap;
    margin-bottom: 24px;
    align-items:center;
  }
  .doc-search {
    flex:1; min-width:240px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius:6px;
    padding: 10px 14px;
    color: var(--white);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    outline:none;
    transition: border-color 0.2s;
  }
  .doc-search:focus { border-color: rgba(201,168,76,0.4); }
  .doc-search::placeholder { color: var(--muted); }
  .type-filter {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(201,168,76,0.2);
    border-radius:6px;
    padding: 10px 14px;
    color: var(--white);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    outline:none;
    cursor: pointer;
    transition: border-color 0.2s;
  }
  .type-filter:focus, .type-filter:hover { border-color: var(--gold); }
  .doc-count {
    font-family:'DM Mono', monospace;
    font-size:11px;
    color: var(--muted);
    letter-spacing:1px;
  }

  /* ── DOC GRID ── */
  .doc-grid {
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 18px;
  }
  .doc-card {
    background: var(--navy2);
    border: 1px solid rgba(201,168,76,0.15);
    border-radius: 8px;
    padding: 20px 22px;
    display:flex; flex-direction:column;
    position:relative; overflow:hidden;
    transition: border-color 0.2s, transform 0.15s;
  }
  .doc-card::before {
    content:''; position:absolute; top:0; left:0; right:0;
    height:2px;
    background: linear-gradient(90deg, var(--gold), transparent);
  }
  .doc-card:hover {
    border-color: rgba(201,168,76,0.4);
    transform: translateY(-2px);
  }
  .doc-card-top {
    display:flex; justify-content:space-between; align-items:flex-start;
    gap:10px; margin-bottom:10px;
  }
  .doc-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 1.5px;
    color: var(--gold2);
    line-height:1.1;
    flex:1;
  }
  .type-badge {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 1.5px;
    padding: 3px 8px;
    border-radius: 3px;
    font-weight: 500;
    flex-shrink:0;
  }
  .type-pdf  { background: rgba(224,92,92,0.18);  color:#f08080; border:1px solid rgba(224,92,92,0.3); }
  .type-html { background: rgba(42,100,150,0.25); color:#7ab8e8; border:1px solid rgba(42,100,150,0.4); }
  .type-xlsx { background: rgba(76,175,125,0.15); color:#7dd4a8; border:1px solid rgba(76,175,125,0.25); }
  .type-docx { background: rgba(122,184,232,0.15);color:#9cc8ec; border:1px solid rgba(122,184,232,0.25); }
  .type-pptx { background: rgba(224,156,76,0.18); color:#f0b878; border:1px solid rgba(224,156,76,0.3); }
  .type-default { background: rgba(255,255,255,0.06); color: var(--muted); border:1px solid rgba(255,255,255,0.1); }

  .doc-desc {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.5;
    margin-bottom: 16px;
    flex:1;
  }
  .doc-meta {
    display:flex; justify-content:space-between; align-items:center;
    padding-top: 12px;
    border-top: 1px solid rgba(255,255,255,0.05);
  }
  .doc-date {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--muted);
  }
  .doc-open-btn {
    display:inline-flex; align-items:center; gap:6px;
    padding: 6px 12px;
    background: rgba(201,168,76,0.1);
    border: 1px solid rgba(201,168,76,0.3);
    border-radius: 5px;
    color: var(--gold2);
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    letter-spacing: 0.5px;
    text-decoration:none;
    transition: all 0.2s;
  }
  .doc-open-btn:hover {
    background: rgba(201,168,76,0.2);
    border-color: var(--gold);
    color: var(--gold3);
  }
  .doc-open-btn svg { width:12px; height:12px; fill:currentColor; }

  .empty-state {
    text-align:center;
    padding: 60px 20px;
    color: var(--muted);
    font-size: 14px;
    grid-column: 1/-1;
  }

  .footer { text-align:center; padding:24px; font-size:11px; color:var(--muted); letter-spacing:1px; border-top:1px solid rgba(255,255,255,0.05); margin-top:16px; }
  .footer span { color:var(--gold); }

  @media(max-width:900px){
    .main{padding:20px;}
    .header{padding:20px;flex-direction:column;align-items:flex-start;gap:12px;}
    .topnav { padding: 0 20px; overflow-x:auto; }
    .nav-tab { padding: 12px 16px; font-size:14px; }
  }
</style>
</head>
<body>
<div class="header">
  <div class="header-left">
    <h1>Dance Infusion</h1>
    <div class="subtitle">Documents Library &nbsp;·&nbsp; Event #2</div>
  </div>
  <div class="header-right">
    <div class="event-date">May 9, 2026 &nbsp;·&nbsp; 3–10 PM</div>
    <div class="venue">Signal NYC &nbsp;·&nbsp; 175 Morgan Ave, Brooklyn</div>
  </div>
</div>

<nav class="topnav">
  <a href="index.html" class="nav-tab active">Documents</a>
  <a href="dashboard.html" class="nav-tab">Dashboard</a>
</nav>

<div class="main">
  <div class="filter-bar">
    <input type="text" id="docSearch" class="doc-search" placeholder="Search documents…">
    <select id="typeFilter" class="type-filter">
      <option value="">All types</option>
    </select>
    <div class="doc-count" id="docCount">— documents</div>
  </div>

  <div class="doc-grid" id="docGrid"></div>
</div>

<div class="footer">DANCE INFUSION <span>·</span> May 9, 2026 <span>·</span> Signal NYC</div>

<script>
const fmtDate = (iso) => {
  if (!iso) return '';
  const d = new Date(iso + 'T00:00:00');
  if (isNaN(d)) return iso;
  return d.toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
};

const typeClass = (t) => {
  const k = (t || '').toLowerCase();
  return ['pdf','html','xlsx','docx','pptx'].includes(k) ? 'type-' + k : 'type-default';
};

let _docs = [];

async function loadManifest() {
  const res = await fetch('docs/manifest.json', { cache: 'no-store' });
  if (!res.ok) throw new Error('Could not load docs/manifest.json (HTTP ' + res.status + ')');
  return res.json();
}

function renderTypeFilter(docs) {
  const types = [...new Set(docs.map(d => d.type).filter(Boolean))].sort();
  const sel = document.getElementById('typeFilter');
  types.forEach(t => {
    const opt = document.createElement('option');
    opt.value = t;
    opt.textContent = t;
    sel.appendChild(opt);
  });
}

function renderCards() {
  const q = document.getElementById('docSearch').value.trim().toLowerCase();
  const t = document.getElementById('typeFilter').value;
  const filtered = _docs.filter(d => {
    if (t && d.type !== t) return false;
    if (q) {
      const hay = [d.title, d.description, d.filename, d.type].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  document.getElementById('docCount').textContent =
    filtered.length + (filtered.length === 1 ? ' document' : ' documents');

  const grid = document.getElementById('docGrid');
  if (filtered.length === 0) {
    grid.innerHTML = '<div class="empty-state">No documents match your filter.</div>';
    return;
  }

  grid.innerHTML = filtered.map(d => `
    <div class="doc-card">
      <div class="doc-card-top">
        <div class="doc-title">${d.title || d.filename}</div>
        <div class="type-badge ${typeClass(d.type)}">${d.type || 'FILE'}</div>
      </div>
      <div class="doc-desc">${d.description || ''}</div>
      <div class="doc-meta">
        <div class="doc-date">${fmtDate(d.date)}</div>
        <a class="doc-open-btn" href="docs/${encodeURIComponent(d.filename)}" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24"><path d="M14 3h7v7h-2V6.41l-9.29 9.3-1.42-1.42 9.3-9.29H14V3zM5 5h6v2H5v12h12v-6h2v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"/></svg>
          Open
        </a>
      </div>
    </div>
  `).join('');
}

loadManifest().then(docs => {
  _docs = docs.slice().sort((a,b) => (b.date || '').localeCompare(a.date || ''));
  renderTypeFilter(_docs);
  renderCards();
  document.getElementById('docSearch').addEventListener('input', renderCards);
  document.getElementById('typeFilter').addEventListener('change', renderCards);
}).catch(err => {
  document.getElementById('docGrid').innerHTML = `
    <div class="empty-state" style="color:var(--red)">
      ⚠ ${err.message}<br>
      <span style="color:var(--muted);font-size:12px">Make sure you opened this page via server.bat → http://localhost:8000/</span>
    </div>`;
});
</script>
</body>
</html>
