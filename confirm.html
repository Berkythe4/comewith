<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Confirm subscription — Come With</title>
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<link rel="icon" id="favicon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inconsolata:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root { --ink:#1A1410;--bg:#F2EDE6;--red:#C13B2A;--mid:#8A7F72;--border:rgba(26,20,16,0.14);--green:#3B6D11;--green-bg:#DFF0D0; }
body { background: var(--bg); color: var(--ink); font-family: 'Inconsolata', monospace; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
body::before { content:''; position:fixed; inset:0; background-image:radial-gradient(circle,rgba(26,20,16,0.05) 1px,transparent 1px); background-size:18px 18px; pointer-events:none; z-index:0; }
.card { background: white; border: 1px solid var(--border); padding: 40px 36px; max-width: 460px; width: 100%; text-align: center; position: relative; z-index: 1; }
.brand { font-family: 'Bebas Neue', sans-serif; font-size: 2rem; letter-spacing: 0.06em; margin-bottom: 8px; }
.kicker { font-size: 0.65rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--mid); margin-bottom: 24px; }
.spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid var(--border); border-top-color: var(--red); border-radius: 50%; animation: spin 0.6s linear infinite; margin-right: 8px; vertical-align: -3px; }
@keyframes spin { to { transform: rotate(360deg); } }
.state { font-size: 0.9rem; line-height: 1.6; }
.state.ok { color: var(--green); }
.state.err { color: var(--red); }
.checkmark { font-size: 2.5rem; color: var(--green); display: block; margin-bottom: 12px; }
.email { font-weight: 500; color: var(--ink); }
.detail { font-size: 0.78rem; color: var(--mid); margin-top: 14px; }
.detail a { color: var(--ink); }
</style>
</head>
<body>
<div class="card">
  <div class="brand">Come With</div>
  <div class="kicker">Mailing list</div>
  <div id="state" class="state"><span class="spinner"></span>Confirming…</div>
</div>
<script type="module">
const SUPABASE_URL = 'https://yaytdosxfhcqatmhctzk.supabase.co';
const PUBLISHABLE_KEY = 'sb_publishable_IkigzWOTU3ZSMK9DxqwwJw_AaQkShCi';
const escapeHtml = (s) => { if (s == null) return ''; return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'", '&#39;'); };
const token = new URLSearchParams(window.location.search).get('token');
const stateEl = document.getElementById('state');
function show(html, kind) { stateEl.className = 'state ' + kind; stateEl.innerHTML = html; }
if (!token) {
  show('Missing token. Did you copy the link from the email correctly?', 'err');
} else {
  fetch(`${SUPABASE_URL}/functions/v1/confirm-subscription`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'apikey': PUBLISHABLE_KEY, 'Authorization': `Bearer ${PUBLISHABLE_KEY}` },
    body: JSON.stringify({ token }),
  })
    .then(r => r.json().then(d => ({ ok: r.ok, d })))
    .then(({ ok, d }) => {
      if (!ok) { show(escapeHtml(d.error || 'Confirmation failed'), 'err'); return; }
      const already = d.already ? ' (already confirmed earlier)' : '';
      show(`<span class="checkmark">✓</span>You're subscribed${already}.<div class="email">${escapeHtml(d.email)}</div><div class="detail">You'll hear from us when there's something worth your inbox. Reply to <a href="mailto:berky@comewith.org">berky@comewith.org</a> anytime.</div>`, 'ok');
    })
    .catch(e => show(escapeHtml('Network error: ' + (e.message || e)), 'err'));
}
</script>
</body>
</html>
