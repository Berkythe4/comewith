/* Canonical URL is /links/<slug> (and /links for the main page). _redirects
 * rewrites both to this file. ?p=<slug> still works — an old bio link, or a
 * host without the rewrite — but is normalised here, BEFORE the deferred
 * beacon runs, so one page never records itself under two different paths. */
(function () {
  try {
    var q = new URLSearchParams(location.search), p = q.get('p');
    if (p && /^\/links(\/|$)/.test(location.pathname)) {
      q.delete('p');
      var rest = q.toString();
      history.replaceState(null, '', '/links/' + p + (rest ? '?' + rest : '') + location.hash);
    }
  } catch (e) { /* a tidy URL is never worth a blank page */ }
})();

          iconHtml('link') + ' Share this page</button>' +
      '</footer>';
    $('body').innerHTML = html;
    document.title = page.title + ' — Links';
    var d = document.querySelector('meta[name="description"]');
    if (d && page.seo_description) d.setAttribute('content', page.seo_description);
    var btn = $('shareBtn');
    if (btn) btn.addEventListener('click', function () {
      var url = location.href;
      if (navigator.share) { navigator.share({ title: page.title, url: url }).catch(function () {}); return; }
      if (navigator.clipboard) {
        navigator.clipboard.writeText(url).then(function () {
          btn.innerHTML = iconHtml('link') + ' Link copied';
          setTimeout(function () { btn.innerHTML = iconHtml('link') + ' Share this page'; }, 1800);
        }).catch(function () {});
      }
    });
  }
  function state(msg) { $('body').innerHTML = '<div class="state">' + esc(msg) + '</div>'; }

  /* ---- Which page? --------------------------------------------------------
   * /links/<slug>, or ?p=<slug>, or the main page. A slug that does not exist
   * and an UNPUBLISHED slug are the same answer on purpose — the views only
   * return published rows, so this page can never confirm a draft exists. */
  function slugFromUrl() {
    var m = location.pathname.match(/^\/links\/([A-Za-z0-9-]{1,40})\/?$/);
    if (m) return m[1].toLowerCase();
    var q = new URLSearchParams(location.search).get('p');
    return (q || 'main').toLowerCase().slice(0, 40);
  }
  function api(path) {
    return fetch(CWURL + '/rest/v1/' + path, { headers: CWH })
      .then(function (r) { if (!r.ok) throw new Error('http ' + r.status); return r.json(); });
  }
  function load() {
    var slug = slugFromUrl();
    var enc = encodeURIComponent(slug);
    Promise.all([
      api('v_public_link_pages?slug=eq.' + enc + '&select=*&limit=1'),
      api('v_public_link_items?page_slug=eq.' + enc + '&select=*&order=sort_order.asc,created_at.asc&limit=200')
    ]).then(function (res) {
      var page = (res[0] || [])[0];
      if (!page) { state('This page is not available.'); return; }
      render(page, res[1] || []);
      // The beacon is loaded only once there is a real page — a 404 is not a visit.
      var s = document.createElement('script');
      s.src = '/assets/track.js'; s.defer = true; document.body.appendChild(s);
    }).catch(function () {
      state('Could not load this page. Please try again.');
    });
  }

  if (PREVIEW) {
    // Dashboard preview. Same origin only, and the payload is data the editor
    // already holds — nothing here is executed, only rendered.
    state('Preview');
    window.addEventListener('message', function (e) {
      if (e.origin !== location.origin) return;
      var d = e.data;
      if (!d || d.cw !== 'links-preview') return;
      try { render(d.page || { title: 'Untitled' }, d.items || []); } catch (err) {}
    });
    if (window.parent !== window) window.parent.postMessage({ cw: 'links-preview-ready' }, location.origin);
  } else {
    load();
  }
})();
</script>
</body>
</html>
