# --- Radio ---------------------------------------------------------------------
# These were deployed by hand and were NOT recorded here, which is a trap: a
# plain `supabase functions deploy get-station` defaults verify_jwt to TRUE and
# would make the public episode page start demanding a login. Pinned now.
# (No import_map: these functions have no deno.json — the CLI defaults the
# entrypoint to ./functions/<name>/index.ts.)

[functions.get-station]
enabled = true
verify_jwt = false          # PUBLIC — serves radio.html to signed-out listeners

[functions.sc-oauth]
enabled = true
verify_jwt = false          # PUBLIC — it is SoundCloud's OAuth redirect target

[functions.listener-shows]
enabled = true
verify_jwt = true           # any signed-in listener; identity comes from the JWT

[functions.track-sources]
enabled = true
verify_jwt = true           # admin-only (role re-checked inside the function)

[functions.track]
enabled = true
verify_jwt = false          # PUBLIC beacon — sendBeacon cannot set an apikey header

[functions.ingest-email]
enabled = true
verify_jwt = false          # PUBLIC — inbound email webhook; gated by INGEST_SECRET
